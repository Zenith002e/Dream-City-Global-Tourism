<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Details | Dream City Global Tourism</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f8f9fb; color: #222; line-height: 1.6; }
        nav { padding: 20px 10%; background: #0f2027; display: flex; justify-content: space-between; align-items: center; color: white; }
        
        .container { max-width: 1000px; margin: 50px auto; padding: 0 20px; }
        .itinerary-header { margin-bottom: 40px; }
        .itinerary-header h1 { font-size: 36px; color: #0f2027; }
        .tag { background: #ffb703; padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; }
        
        .itinerary-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        
        .day-box { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-left: 5px solid #ffb703; }
        .day-box h3 { margin-bottom: 10px; color: #0f2027; }
        
        .sidebar { background: #0f2027; color: white; padding: 30px; border-radius: 12px; height: fit-content; position: sticky; top: 20px; }
        .sidebar h4 { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .sidebar ul { list-style: none; margin-bottom: 30px; }
        .sidebar ul li { margin-bottom: 10px; font-size: 14px; display: flex; align-items: flex-start; }
        .sidebar ul li::before { content: '✓'; color: #ffb703; margin-right: 10px; font-weight: bold; }
        
        .book-btn { display: block; width: 100%; text-align: center; background: #ffb703; color: #0f2027; padding: 15px; border-radius: 8px; font-weight: 700; text-decoration: none; transition: 0.3s; }
        .book-btn:hover { background: white; }

        @media (max-width: 768px) { .itinerary-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <h2 style="cursor:pointer" onclick="location.href='index.html'">Dream City Global Tourism</h2>
    <a href="tours.html" style="color:white; text-decoration:none;">← Back to Tours</a>
</nav>

<div class="container">
    <div class="itinerary-header">
        <span class="tag" id="package-duration">Duration</span>
        <h1 id="package-title">Loading Package...</h1>
        <p id="package-desc" style="color: #666; margin-top: 10px;"></p>
    </div>

    <div class="itinerary-grid">
        <div class="main-itinerary" id="itinerary-list">
            </div>

        <aside class="sidebar">
            <h4>Package Includes</h4>
            <ul id="inclusions-list">
            </ul>
            <a href="mailto:dreamcityglobaltourism@gmail.com" class="book-btn" id="mail-link">Enquire for Booking</a>
        </aside>
    </div>
</div>

<script>
    // 1. Data Object (The database of your trips)
    const tourData = {
        "ladakh": {
            title: "Leh Bike Expedition",
            duration: "6 Days / 5 Nights",
            desc: "A journey through high passes, crystal lakes, and ancient monasteries.",
            inclusions: [
                "Triple-sharing camps/hotels (double for couples); breakfast & dinner included (except Day 1 breakfast)",
                "Inner line permits, airport transfers, and Royal Enfield Himalayan with fuel",
                "Helmets, backup vehicle, mechanic, tour marshal, and daily bike maintenance",
                "First aid kit, 24/7 oxygen cylinder, and all planned sightseeing/excursions"
            ],
            days: [
                { day: "Day 1", title: "Arrival in Leh", detail: "Transfer to hotel. Complete day rest for acclimatization to high altitude." },
                { day: "Day 2", title: "Leh Local Sightseeing", detail: "Visit Shanti Stupa, Leh Palace, and the Hall of Fame Museum." },
                { day: "Day 3", title: "Leh to Nubra Valley", detail: "Drive via Khardung La (World's highest motorable road). Enjoy Camel Safari." },
                { day: "Day 4", title: "Nubra to Pangong Lake", detail: "Travel to the famous Pangong Lake via Shyok river road." },
                { day: "Day 5", title: "Pangong to Leh", detail: "Return to Leh. Evening free for shopping at Leh Market." },
                { day: "Day 6", title: "Departure", detail: "Transfer to Leh airport." }
            ]
        },
        "kashmir": {
            title: "Kashmir: Paradise on Earth",
            duration: "6 Days / 5 Nights",
            desc: "Experience the romance and beauty of the valley.",
            inclusions: [
                "accommodation on Twin Sharing basis",
                "Daily Breakfast & Dinner",
                "1 Hour Shikara Ride on Dal Lake",
                "Welcome Drink on Arrival",
                "All Transfers & Sightseeing by Private Vehicle",
                "Toll tax, parking, and driver allowances"
            ],
            days: [
                { day: "Day 1", title: "Srinagar Arrival", detail: "Check-in to a Deluxe Hotel. Enjoy an evening Shikara ride on Dal Lake." },
                { day: "Day 2", title: "Srinagar to Pahalgam", detail: "Travel to Pahalgam, the Valley of Shepherds. Visit the beautiful Betaab Valley, Aru Valley, and Lidder River surroundings. Enjoy the natural beauty and peaceful atmosphere." },
                { day: "Day 3", title: "Pahalgam to Srinagar by surface", detail: "Return to Srinagar by road. On arrival, visit the famous Mughal Gardens including Nishat Bagh and Shalimar Bagh, followed by a visit to the historic Shankaracharya Temple." },
                { day: "Day 4", title: "Srinagar to Gulmarg", detail: "Drang by union vehicle, do horse ride, gandola ride, ATV ride" },
                { day: "Day 5", title: "Srinagar to Sonmarg", detail: "Visit Thajiwas Glacier , Visit zero point via zojila pass by union vechile" },
              //  { day: "Day 6", title: "Departure from srinagar", detail: "Transfer to Srinagar airport." }
            ]
        },
        "shrilanka": {
            title: "Shrilanka: A Tropical Paradise",
            duration: "6 Days / 5 Nights",
            desc: "Experience the vibrant culture and stunning beaches of this island nation.",
            inclusions: [
                "Accommodation on Twin/Triple Sharing basis",
                "Daily Breakfast & Dinner at the hotel",
                "Transfers by AC Volvo Bus",
                "Local Sightseeing by Private Cab",
                "All applicable taxes and parking fees"
            ],
            days: [
                { day: "Day 1", title: "Arrival", detail: "Colombo Airport to Colombo hotel." },
                { day: "Day 2", title: "Local Sightseeing", detail: "Colombo - Sightseeing and Excursions in Colombo" },
                { day: "Day 3", title: "Colombo to Kandy ", detail: "Transfer and En Route Pinnawala" },
                { day: "Day 4", title: "Kandy", detail: "Nuwara Eliya Sightseeing day tour" },
                { day: "Day 5", title: "Kandy Excursion", detail: "Sightseeing and Excursions around KandyExplore the local markets and cafes." },
                { day: "Day 6", title: "Departure", detail: "Kandy to Colombo Airport - Departure" }
            ]
        },
        "dubai": {
            title: "Dubai: The City of Gold",
            duration: "6 Days / 5 Nights",
            desc: "Experience the luxury and excitement of the UAE's most vibrant city.",
            inclusions: [
                "4 star hotel accommodation on twin sharing basis",
                "All meals (breakfast, lunch, and dinner) included",
                "Comfortable transfers by AC vehicle",
                "Tour guide for all sightseeing tours",
                "VAT included",
            ],
            days: [
                { day: "Day 1", title: "Arrival", detail: "Transport to Hotel in evening Dhow cruise marina with international buffet dinner" },
                { day: "Day 2", title: "Local Sightseeing", detail: "Half Day Dubai City Tour , Burj Khalifa 124th/125th floor of peak with tickets" },
                { day: "Day 3", title: "Full Day Sightseeing ", detail: "Dubai dolphinarium show, atlantis lost world aquarium" },
                { day: "Day 4", title: "Dubai Excursion", detail: "Dubai Frame, Desert Safari with BBQ dinner" },
                { day: "Day 5", title: "Abu Dhabi Excursion", detail: "Abu Dhabi City Tour with BAPS Temple and Grand Mosque" },
                { day: "Day 6", title: "Departure", detail: "Shopping on your own, Airport Drop off" }
            ]
        },
    };

    // 2. Logic to display the correct tour
    const urlParams = new URLSearchParams(window.location.search);
    const tourId = urlParams.get('id');

    if (tourId && tourData[tourId]) {
        const tour = tourData[tourId];
        
        // Populate Header Data
        document.getElementById('package-title').innerText = tour.title;
        document.getElementById('package-duration').innerText = tour.duration;
        document.getElementById('package-desc').innerText = tour.desc;
        document.getElementById('mail-link').href = `mailto:dreamcityglobaltourism@gmail.com?subject=Booking Inquiry: ${tour.title}`;

        // Populate Itinerary Days
        const list = document.getElementById('itinerary-list');
        tour.days.forEach(item => {
            const div = document.createElement('div');
            div.className = 'day-box';
            div.innerHTML = `<h3>${item.day}: ${item.title}</h3><p>${item.detail}</p>`;
            list.appendChild(div);
        });

        // Populate Inclusions
        const inclusionsList = document.getElementById('inclusions-list');
        tour.inclusions.forEach(inc => {
            const li = document.createElement('li');
            li.innerText = inc;
            inclusionsList.appendChild(li);
        });

    } else {
        document.getElementById('package-title').innerText = "Package Not Found";
        document.getElementById('package-desc').innerText = "Please select a valid tour package from the tours page.";
    }
</script>

</body>
</html>
